# ---- add under `services:` ----
  neo4j:
    image: neo4j:5.24
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/itri623pass
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data

  graph-service:
    build: ./graph-service
    container_name: graph-service
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: itri623pass
      SOC_URL: http://soc-event-service:8084
    ports:
      - "8085:8085"
    depends_on:
      - neo4j
      - soc-event-service

# ---- add under the top-level `volumes:` ----
  neo4j-data:
