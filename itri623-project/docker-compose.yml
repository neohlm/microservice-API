version: "3.8"

services:
  # ---------- Databases (one per service — Database-per-Service pattern) ----------
  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - itri623-net

  asset-db:
    image: postgres:16-alpine
    container_name: asset-db
    environment:
      POSTGRES_DB: assetdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - asset-db-data:/var/lib/postgresql/data
    networks:
      - itri623-net

  ticket-db:
    image: postgres:16-alpine
    container_name: ticket-db
    environment:
      POSTGRES_DB: ticketdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - ticket-db-data:/var/lib/postgresql/data
    networks:
      - itri623-net

  soc-event-db:
    image: postgres:16-alpine
    container_name: soc-event-db
    environment:
      POSTGRES_DB: soc_eventdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - soc-event-db-data:/var/lib/postgresql/data
    networks:
      - itri623-net

  # ---------- Service Registry ----------
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - itri623-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Domain Services ----------
  user-service:
    build: ./user-service
    container_name: user-service
    depends_on:
      - eureka-server
      - user-db
    ports:
      - "8081:8081"
    networks:
      - itri623-net

  asset-service:
    build: ./asset-service
    container_name: asset-service
    depends_on:
      - eureka-server
      - asset-db
    ports:
      - "8082:8082"
    networks:
      - itri623-net

  ticket-service:
    build: ./ticket-service
    container_name: ticket-service
    depends_on:
      - eureka-server
      - ticket-db
      - asset-service
    ports:
      - "8083:8083"
    networks:
      - itri623-net

  soc-event-service:
    build: ./soc-event-service
    container_name: soc-event-service
    depends_on:
      - eureka-server
      - soc-event-db
    ports:
      - "8084:8084"
    networks:
      - itri623-net

  # ---------- API Gateway ----------
  gateway:
    build: ./gateway
    container_name: gateway
    depends_on:
      - eureka-server
      - user-service
      - ticket-service
      - asset-service
    ports:
      - "8090:8080"
    networks:
      - itri623-net

networks:
  itri623-net:
    driver: bridge

volumes:
  user-db-data:
  asset-db-data:
  ticket-db-data:
  soc-event-db-data:
