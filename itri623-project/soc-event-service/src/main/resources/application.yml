server:
  port: 8084

spring:
  application:
    name: soc-event-service
  datasource:
    url: jdbc:postgresql://soc-event-db:5432/soc_eventdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

soc:
  rules:
    window-minutes: 5
    failed-login-threshold: 5
    unauthorised-threshold: 3
    request-rate-threshold: 30
    request-rate-window-seconds: 60
    service-failure-threshold: 3
    interval-ms: 15000
